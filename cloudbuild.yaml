steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build', 
      '--build-arg',
      'PHOENIX_MCP_VERSION=4.0.13',
      '-t', 'us-central1-docker.pkg.dev/yentlguard/cloud-run-source-deploy/harmoni-yentlguard-agent/yentlguard-ui:$COMMIT_SHA',
      '-t', 'us-central1-docker.pkg.dev/yentlguard/cloud-run-source-deploy/harmoni-yentlguard-agent/yentlguard-ui:latest',
      '.'
    ]

  # Step 2: Push the image tags to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'push', 
      'us-central1-docker.pkg.dev/yentlguard/cloud-run-source-deploy/harmoni-yentlguard-agent/yentlguard-ui',
      '--all-tags'
    ]

  # Step 3: Deploy to Cloud Run with unified settings and fixed Env syntax
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
    - 'run'
    - 'deploy'
    - 'yentlguard-ui'
    - '--image'
    - 'us-central1-docker.pkg.dev/yentlguard/cloud-run-source-deploy/harmoni-yentlguard-agent/yentlguard-ui:$COMMIT_SHA'
    - '--region'
    - 'us-central1'
    - '--min-instances'
    - '0'
    - '--max-instances'
    - '3'
    - '--allow-unauthenticated'
    - '--memory'
    - '1Gi'
    - '--timeout'
    - '3600'
    - '--concurrency'
    - '80'
    - '--set-env-vars'
    - 'PHOENIX_COLLECTOR_ENDPOINT=https://app.phoenix.arize.com/s/yentlguard/,GEMINI_MODEL=gemini-2.5-pro,YENTLGUARD_GCP_PROJECT=yentlguard,YENTLGUARD_BQ_DATASET=yentlguard,YENTLGUARD_GCS_BUCKET=yentlguard-analysis'
    - '--set-secrets'
    - 'PHOENIX_API_KEY=PHOENIX_API_KEY:latest'

images:
- 'us-central1-docker.pkg.dev/yentlguard/cloud-run-source-deploy/harmoni-yentlguard-agent/yentlguard-ui:$COMMIT_SHA'
- 'us-central1-docker.pkg.dev/yentlguard/cloud-run-source-deploy/harmoni-yentlguard-agent/yentlguard-ui:latest'